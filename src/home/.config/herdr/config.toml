# herdr configuration
# see all options: `herdr --default-config`
# reload after edit: `herdr server reload-config`

[theme]
# match ghostty's TokyoNight.
# built-in: catppuccin, terminal, tokyo-night, dracula, nord, gruvbox,
#           one-dark, solarized, kanagawa, rose-pine, vesper
name = "tokyo-night"

[theme.custom]
# active agent/space rows are filled with surface_dim, but tokyo-night defines
# surface_dim == panel_bg (#1a1b26), so the fill is invisible and only the
# workspace token's brighter text ever marked the focused entry. the agents
# name row here uses $name instead (custom tokens get no focus styling in
# herdr 0.8.0, see resolved_token_spans() in src/ui/sidebar.rs), so give the
# fill a visible colour: tokyo-night's bg_highlight. also used for dividers,
# separators and the scrollbar track, which become slightly more visible.
surface_dim = "#292e42"

[keys]
# prefix key. ctrl+g is a plain terminal keystroke, so this works in any
# terminal (ghostty, Terminal.app, ...) with no host-side setup.
# ctrl+g is readline/emacs abort, but unused in my workflow (C-c instead).
# press ctrl+g twice to send a literal ctrl+g to the pane app
# (e.g. gemini cli's "open in external editor").
prefix = "ctrl+g"

# tab       : prefix+c new / prefix+n next / prefix+p prev / prefix+1..9 jump
# pane      : prefix+v split-v / prefix+- split-h / prefix+h j k l focus
#             (emacs-style ctrl+b/n/p/f also focus left/down/up/right)
# workspace : prefix+w navigate (sticky pane move too) / prefix+shift+n new
#             prefix+shift+g new worktree
# other     : prefix+g goto picker / prefix+z zoom / prefix+e scrollback
#             prefix+q detach / prefix+? help

# navigate mode == the prefix+w surface. it stays open until enter/esc, so
# it doubles as a "sticky" pane-move mode: prefix+w, then arrows as many
# times as needed, enter (or esc) to leave. directional pane focus keeps
# navigate mode active since 0.8.0. a binding may be an array when one
# action needs several shortcuts.
#
# key split inside navigate mode:
#   ctrl+p/n : workspace selection (sidebar cursor), enter to switch
#   arrows   : pane focus (left/right are built-in aliases and cannot be
#              listed here; up/down are bound explicitly)
# a key shared between navigate_workspace_* and navigate_pane_* is a
# conflict: `herdr config check` keeps the workspace binding and disables
# the pane one, so ctrl+p/n are deliberately not on the pane side.
#
# prefix+g (goto picker) is a separate surface with its own hardcoded keys,
# not configurable as of 0.8.0: j/k or arrows in the list, "/" to search,
# and ctrl+n/p only once the search box has focus.
navigate_workspace_up   = "ctrl+p"
navigate_workspace_down = "ctrl+n"
navigate_pane_left      = "h"
navigate_pane_down      = ["j", "down"]
navigate_pane_up        = ["k", "up"]
navigate_pane_right     = "l"

# directional pane focus (one-shot): keep the default vim keys and add
# emacs-style ctrl+b/n/p/f (same left/down/up/right mapping as the shell
# line editor). for repeated moves use navigate mode above instead.
focus_pane_left  = ["prefix+h", "prefix+ctrl+b"]
focus_pane_down  = ["prefix+j", "prefix+ctrl+n"]
focus_pane_up    = ["prefix+k", "prefix+ctrl+p"]
focus_pane_right = ["prefix+l", "prefix+ctrl+f"]

[worktrees]
# where `prefix+shift+g` creates git worktrees
directory = "~/.herdr/worktrees"

[experimental]
# prefixモード中だけ入力ソースをASCII(英語)に切り替え、抜けたら元のIMEに戻す。
# 日本語入力のままでも prefix+w 等がIMEに食われなくなる。macOS best-effort.
switch_ascii_input_source_in_prefix = true

[ui]
# ask for a tab name when creating a tab. set false to skip the prompt.
prompt_new_tab_name = true

# don't auto-copy mouse selections; selection stays until cmd+c copies it.
copy_on_select = false

# agent panes, 4 rows each, same layout for every agent. the $tokens are
# pushed per pane via `herdr pane report-metadata`; today only claude code
# does so (src/home/.claude/statusline.sh). an agent that pushes nothing shows
# just the state icon on row 1 and "agent · state" on row 2, rows 3-4 collapse.
#   1  state icon + session name ($name; for claude the name /list-agents and
#      SendMessage use, e.g. "setting-42")
#   2  agent name + state text + context usage ($ctx)
#   3  5h account usage window: bar, percent, reset time ($five)
#   4  7d account usage window: bar, percent, reset date ($week)
# the herdr default name row is workspace + tab; both are dropped since the
# workspace is already in the spaces list and tabs are not in use. until the
# first update of a session the $tokens are empty, as described above.
#
# the 5h/7d limits are account-wide, so all panes of one agent show the same
# two rows. they were on the top workspace's spaces rows before, but that
# entry moves when workspaces are reordered and the values are the agent's,
# not the workspace's.
#
# state_text spells the state out because state_icon alone is colour-only for
# most of it: blocked, working and done all render the same filled dot and
# differ only in red/yellow/teal (state_dot() in herdr's src/ui/status.rs).
[ui.sidebar.agents]
rows = [
  # custom tokens render dim grey and, unlike the workspace token, get no
  # focus-aware colour (herdr 0.8.0/0.9.0 config cannot express "when
  # focused"). so mimic the unfocused workspace look: tokyo-night subtext0,
  # bold, not dimmed. the focused entry is marked by the surface_dim row fill
  # from [theme.custom] instead.
  ["state_icon", { token = "$name", fg = "#a9b1d6", bold = true, dim = false }],
  ["agent", "state_text", { token = "$ctx", dim = true }],
  [{ token = "$five", dim = true }],
  [{ token = "$week", dim = true }],
]

# spaces rows: workspace name, git branch/status, then the pane directories.
#
# $path1..$path6 list the cwd of every pane in the workspace (deduped, pane
# order, ~/workspace/ prefix dropped). pushed by
# ~/.config/herdr/report-pane-paths.sh from the shell precmd hook in
# .zshrc/.bashrc and from statusline.sh; unused slots are cleared so the rows
# collapse. MAX in that script must match the number of rows here.
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  [{ token = "$path1", dim = true }],
  [{ token = "$path2", dim = true }],
  [{ token = "$path3", dim = true }],
  [{ token = "$path4", dim = true }],
  [{ token = "$path5", dim = true }],
  [{ token = "$path6", dim = true }],
]
